# Phala Cloud CVM deployment. Everything here is measured by the attestation, so:
#  - the image is pinned by digest (CI prints it); a mutable tag would defeat verification;
#  - secrets are NOT in this file. They are set as encrypted environment variables and arrive as ${...} below.
# Pinned to the image CI built from commit 649d824 (NORR_COMMIT inside it says so; signed build provenance on GHCR). After any code change, take the new digest from the CI run summary.
services:
  norr:
    image: ghcr.io/outislabs/norr@sha256:014d7ae51dc8e4b20c653907b5a2dccfe742ccbdef8ba4bbb69b5cb59e0f2e82
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Not secret:
      NORR_WALLET: demo
      NORR_OWNER_ACCOUNT: ${NORR_OWNER_ACCOUNT}
      NORR_ALLOWED_ORIGINS: ${NORR_ALLOWED_ORIGINS}
      NORR_POLICY_JSON: ${NORR_POLICY_JSON}
      # Public beta (docs/MULTI-USER.md): OAuth issuer, signups (open|closed), accounts allowed while closed.
      NORR_PUBLIC_URL: https://api.norr.finance
      NORR_SIGNUPS: ${NORR_SIGNUPS}
      NORR_BETA_ALLOWLIST: ${NORR_BETA_ALLOWLIST}
      # Secret (encrypted environment variables):
      NORR_DATA_KEY: ${NORR_DATA_KEY}
      OUTLAYER_DEMO_API_KEY: ${OUTLAYER_DEMO_API_KEY}
      OUTLAYER_DEMO_ACCOUNT_ID: ${OUTLAYER_DEMO_ACCOUNT_ID}
      OUTLAYER_DEMO_WALLET_ID: ${OUTLAYER_DEMO_WALLET_ID}
      ONECLICK_API_KEY: ${ONECLICK_API_KEY}
      SHIELD_API_KEY: ${SHIELD_API_KEY}
      # The operator switch for new vaults (POST /admin/v1/signups). Unset: no admin endpoint at all.
      NORR_ADMIN_TOKEN: ${NORR_ADMIN_TOKEN}
      # NORR_ENV and SHIELD_MODE=dev-bypass are deliberately not passed: the bypass can never run here.
    volumes:
      - norr-data:/data
      # Lets the service ask the TEE for an attestation quote.
      - /var/run/dstack.sock:/var/run/dstack.sock

  # The MCP endpoint remote agents connect to (https://<this CVM>/mcp). It holds no state and no tokens: each request
  # forwards the caller's own agent token to the service. It runs in the same CVM so what handles agent traffic is attested too.
  mcp:
    image: ghcr.io/outislabs/norr@sha256:014d7ae51dc8e4b20c653907b5a2dccfe742ccbdef8ba4bbb69b5cb59e0f2e82
    restart: unless-stopped
    working_dir: /app/apps/mcp
    command: ["../enclave/node_modules/.bin/tsx", "src/http.ts"]
    ports:
      - "8788:8788"
    environment:
      NORR_API_URL: http://norr:8787
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8788"
      # Behind Phala's gateway every request must carry the agent's bearer token; the Host allow-list is for localhost servers.
      MCP_ALLOWED_HOSTS: "*"
      # OAuth (MCP authorization): this endpoint's public URL and its authorization server.
      MCP_PUBLIC_URL: https://mcp.norr.finance
      MCP_AUTH_SERVER: https://api.norr.finance
    depends_on:
      - norr

  # api.norr.finance and mcp.norr.finance: Phala's dstack-ingress terminates TLS inside this CVM (HAProxy, L4) and
  # routes by name. Certificates come from Let's Encrypt over TLS-ALPN-01, so nothing in this CVM holds DNS credentials:
  # the owner creates the CNAME, TXT and CAA records by hand once (the container prints them on first start). The
  # certificates and the ACME account are published at https://<domain>/evidences/ with a TDX quote over their hashes,
  # so a client can check that the certificate it was served was issued to this attested app.
  # Pinned: dstack-ingress 2.8 (https://github.com/Dstack-TEE/dstack-examples/tree/main/custom-domain/dstack-ingress).
  ingress:
    image: ghcr.io/dstack-tee/dstack-ingress:2.8@sha256:60e682449534715a2f2e5b72326ca4229209c8e26c931c6f34d27e02200ac086
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      CHALLENGE_TYPE: tls-alpn-01
      DOMAINS: |
        api.norr.finance
        mcp.norr.finance
      ROUTING_MAP: |
        api.norr.finance=norr:8787
        mcp.norr.finance=mcp:8788
      GATEWAY_DOMAIN: gateway.dstack-pha-prod5.phala.network
      # Wait for the hand-made DNS records before asking Let's Encrypt (the default); the records are printed in the logs.
      DNS_SETUP_MODE: wait
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - cert-data:/etc/letsencrypt
      - evidences:/evidences
    depends_on:
      - norr
      - mcp

volumes:
  norr-data: {}
  cert-data: {}
  evidences: {}
